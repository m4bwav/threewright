<head>
  <meta charset="utf-8">
  <title>fixture: ray tracing in shaders</title>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
  </script>

<body style="margin:0">
<!-- The glsl blocks and makeAccumulator are copied verbatim from
     skills/threewright-shaders/references/ray-tracing-in-shaders.md (tests/unit.test.mjs checks).
     rtMeasure() returns the numbers that file quotes (tests/browser.test.mjs checks). -->
<script type="module">
import * as THREE from 'three';
// Running-mean accumulation: frame n (from 1) is mixed in at weight 1 / n.
function makeAccumulator(renderer, width, height) {
  const target = () => new THREE.WebGLRenderTarget(width, height, { type: THREE.FloatType, depthBuffer: false });
  let read = target(), write = target();
  const frame = target();
  const blend = new THREE.ShaderMaterial({
    uniforms: { uPrev: { value: null }, uNew: { value: null }, uWeight: { value: 1 } },
    vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: 'uniform sampler2D uPrev, uNew; uniform float uWeight; varying vec2 vUv;\n'
      + 'void main() { gl_FragColor = mix(texture2D(uPrev, vUv), texture2D(uNew, vUv), uWeight); }',
  });
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), blend);
  const quadCamera = new THREE.Camera();
  let n = 0;
  return {
    get count() { return n; },
    get target() { return read; },
    reset() { n = 0; },
    add(scene, camera) {
      renderer.setRenderTarget(frame);
      renderer.render(scene, camera);
      n += 1;
      blend.uniforms.uPrev.value = read.texture;
      blend.uniforms.uNew.value = frame.texture;
      blend.uniforms.uWeight.value = 1 / n;
      renderer.setRenderTarget(write);
      renderer.render(quad, quadCamera);
      [read, write] = [write, read];
      renderer.setRenderTarget(null);
    },
  };
}
const fragmentShader = `precision highp float;
precision highp int;
uniform int uMode;
uniform float uShift;
uniform uint uFrame;
uniform vec2 uRes;
uniform sampler2D uEnv;
uniform float uEnvHeight;
varying vec2 vUv;
float rand01(inout uint seed) {
  seed = seed * 747796405u + 2891336453u;
  uint w = ((seed >> ((seed >> 28u) + 4u)) ^ seed) * 277803737u;
  w = (w >> 22u) ^ w;
  return float(w >> 8u) / 16777216.0;
}
float extinction(vec3 p) { return length(p) < 10.0 ? 0.5 : 0.0; }
// Push a new ray origin p off its surface along the geometric normal ng (unit length,
// pointing to the side the new ray leaves from). Far from zero each coordinate moves a
// fixed count of float steps, so the push grows with magnitude; near zero a small
// absolute step takes over, because there the error comes from larger terms.
const float RT_ULP_STEPS = 128.0;
const float RT_NEAR_ZERO = 0.03;
const float RT_ABS_STEP = 3e-5;
vec3 offsetRayOrigin(vec3 p, vec3 ng) {
  ivec3 steps = ivec3(ng * RT_ULP_STEPS);
  // Adding to a negative float's bits moves it away from zero, so flip the step there.
  ivec3 signedSteps = ivec3(p.x < 0.0 ? -steps.x : steps.x, p.y < 0.0 ? -steps.y : steps.y, p.z < 0.0 ? -steps.z : steps.z);
  vec3 stepped = intBitsToFloat(floatBitsToInt(p) + signedSteps);
  vec3 nudged = p + ng * RT_ABS_STEP;
  return mix(stepped, nudged, lessThan(abs(p), vec3(RT_NEAR_ZERO)));
}
// Ray/sphere hit distances, stable for tiny far spheres and huge near ones.
// rd must be unit length. Returns (tNear, tFar); tNear > tFar means a miss.
vec2 intersectSphere(vec3 ro, vec3 rd, vec3 center, float radius) {
  vec3 f = ro - center;
  float b = dot(f, rd);
  vec3 perp = f - b * rd;
  float h = radius * radius - dot(perp, perp);
  if (h < 0.0) return vec2(1.0, -1.0);
  float c = dot(f, f) - radius * radius;
  float q = -b - (b >= 0.0 ? 1.0 : -1.0) * sqrt(h);
  float t0 = c / q;
  return t0 < q ? vec2(t0, q) : vec2(q, t0);
}
// Mip level for an environment lookup by a ray whose footprint spans spread radians.
// Equirectangular map: the full height covers pi radians. Cube map: a face covers pi / 2.
float envLodEquirect(float spread, float heightPx) {
  return max(log2(spread * heightPx / 3.14159265), 0.0);
}
float envLodCube(float spread, float faceSizePx) {
  return max(log2(spread * faceSizePx / 1.57079633), 0.0);
}
// Delta tracking: distance to a real collision in a medium whose extinction(p) never
// exceeds sigmaMax, or -1.0 when the ray leaves (t >= tMax). rand01(seed) is any uniform
// [0, 1) generator. The loop cap is a GLSL necessity and biases toward escaping; size it
// so sigmaMax * tMax stays well under the cap.
float deltaTrack(vec3 ro, vec3 rd, float tMax, float sigmaMax, inout uint seed) {
  float t = 0.0;
  for (int i = 0; i < 256; i++) {
    t -= log(1.0 - rand01(seed)) / sigmaMax;
    if (t >= tMax) return -1.0;
    if (rand01(seed) * sigmaMax < extinction(ro + t * rd)) return t;
  }
  return -1.0;
}
vec3 envColor(vec3 d, float lod) {
  vec2 uv = vec2(atan(d.z, d.x) / 6.2831853 + 0.5, acos(clamp(d.y, -1.0, 1.0)) / 3.14159265);
  return textureLod(uEnv, vec2(uv.x, 1.0 - uv.y), lod).rgb;
}
// Moller-Trumbore triangle test; returns the hit distance (may be negative) or 1e30.
float hitTri(vec3 ro, vec3 rd, vec3 a, vec3 b, vec3 c) {
  vec3 e1 = b - a, e2 = c - a, pv = cross(rd, e2);
  float det = dot(e1, pv);
  if (abs(det) < 1e-12) return 1e30;
  vec3 tv = ro - a;
  float u = dot(tv, pv) / det;
  vec3 qv = cross(tv, e1);
  float v = dot(rd, qv) / det;
  if (u < 0.0 || v < 0.0 || u + v > 1.0) return 1e30;
  return dot(e2, qv) / det;
}
void main() {
  vec2 ndc = vUv * 2.0 - 1.0;
  uvec2 px = uvec2(gl_FragCoord.xy);
  uint seed = px.x * 1973u + px.y * 9277u + uFrame * 26699u + 1u;
  if (uMode == 1 || uMode == 2) {
    // Acne test: a lit plane at height uShift, one shadow ray per pixel, no occluders.
    vec3 ro = vec3(0.0, 2.0, 6.0) + uShift;
    vec3 fwd = normalize(vec3(0.0, -2.0, -6.0));
    vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
    vec3 up = cross(right, fwd);
    vec3 rd = normalize(fwd + 0.6 * (ndc.x * right + ndc.y * up));
    // Two large triangles of a tilted ground, intersected as a triangle ray tracer would.
    vec3 c0 = vec3(-40.0, -4.0, -40.0) + uShift, c1 = vec3(40.0, 4.0, -40.0) + uShift;
    vec3 c2 = vec3(40.0, 8.0, 40.0) + uShift, c3 = vec3(-40.0, 0.0, 40.0) + uShift;
    vec3 n = normalize(cross(c3 - c0, c1 - c0));
    float t = min(hitTri(ro, rd, c0, c1, c2), hitTri(ro, rd, c0, c2, c3));
    if (t > 1e29) { gl_FragColor = vec4(0.5); return; }
    vec3 p = ro + t * rd;
    vec3 L = normalize(vec3(0.3, 1.0, 0.2));
    vec3 o = uMode == 1 ? p : offsetRayOrigin(p, n);
    float tMin = uMode == 1 ? 1e-4 : 0.0;
    float ts = min(hitTri(o, L, c0, c1, c2), hitTri(o, L, c0, c2, c3));
    ts = ts > 1e29 ? -1.0 : ts;
    gl_FragColor = vec4(ts > tMin ? 0.0 : 1.0);
    return;
  }
  if (uMode == 3 || uMode == 4) {
    // Sphere precision test: radius 1 at 10,000 units, framed to about 100 px radius in a 256 px square.
    float tanHalf = 1.25e-4;
    vec3 rd = normalize(vec3(ndc * tanHalf, -1.0));
    vec3 ro = vec3(0.0);
    vec3 ce = vec3(0.0, 0.0, -1e4);
    bool hit;
    if (uMode == 3) {
      vec3 f = ro - ce;
      float b = dot(f, rd);
      float c = dot(f, f) - 1.0;
      float disc = b * b - c;
      hit = disc >= 0.0 && -b - sqrt(max(disc, 0.0)) > 0.0;
    } else {
      vec2 tt = intersectSphere(ro, rd, ce, 1.0);
      hit = tt.x <= tt.y && tt.y > 0.0;
    }
    gl_FragColor = vec4(hit ? 1.0 : 0.0);
    return;
  }
  if (uMode == 5) {
    gl_FragColor = vec4(vec3(rand01(seed)), 1.0);
    return;
  }
  if (uMode == 6) {
    // Delta tracking through extinction 0.5 over length 2 with sigmaMax 2: escape share exp(-1).
    float t = deltaTrack(vec3(0.0), vec3(1.0, 0.0, 0.0), 2.0, 2.0, seed);
    gl_FragColor = vec4(t < 0.0 ? 1.0 : 0.0);
    return;
  }
  // Display: a plane with a sphere's shadow, the sphere mirroring the environment.
  vec3 ro = vec3(0.0, 1.5, 5.0);
  vec3 fwd = normalize(vec3(0.0, 0.8, 0.0) - ro);
  vec3 right = normalize(cross(fwd, vec3(0.0, 1.0, 0.0)));
  vec3 up = cross(right, fwd);
  float tanHalf = 0.4142;
  vec3 rd = normalize(fwd + tanHalf * (ndc.x * uRes.x / uRes.y * right + ndc.y * up));
  float pixelSpread = 2.0 * tanHalf / uRes.y;
  vec3 ce = vec3(0.0, 1.0, 0.0);
  vec3 L = normalize(vec3(0.5, 1.0, 0.3));
  vec2 ts = intersectSphere(ro, rd, ce, 1.0);
  vec3 col = envColor(rd, envLodEquirect(pixelSpread, uEnvHeight));
  float tp = rd.y < 0.0 ? -ro.y / rd.y : 1e30;
  if (ts.x <= ts.y && ts.x > 0.0 && ts.x < tp) {
    vec3 p = ro + ts.x * rd;
    vec3 n = normalize(p - ce);
    // Reflection off a unit sphere widens the cone by about twice the footprint per unit distance.
    float spread = pixelSpread + 2.0 * pixelSpread * ts.x;
    col = 0.9 * envColor(reflect(rd, n), envLodEquirect(spread, uEnvHeight));
  } else if (tp < 1e29) {
    vec3 p = ro + tp * rd;
    p.y = 0.0;
    vec3 o = offsetRayOrigin(p, vec3(0.0, 1.0, 0.0));
    vec2 sh = intersectSphere(o, L, ce, 1.0);
    float lit = sh.x <= sh.y && sh.y > 0.0 ? 0.0 : 1.0;
    float check = mod(floor(p.x) + floor(p.z), 2.0);
    col = (0.25 + 0.75 * lit * L.y) * mix(vec3(0.75), vec3(0.45), check);
  }
  gl_FragColor = vec4(col, 1.0);
}
`;
const W = 256, H = 256;
const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const envData = new Uint8Array(64 * 32 * 4);
for (let y = 0; y < 32; y++) for (let x = 0; x < 64; x++) {
  const i = (y * 64 + x) * 4, sky = y >= 16, stripe = (x % 4) < 2;
  envData[i] = sky ? 120 + 8 * (y - 16) : (stripe ? 200 : 40);
  envData[i + 1] = sky ? 160 + 5 * (y - 16) : (stripe ? 140 : 30);
  envData[i + 2] = sky ? 230 : (stripe ? 90 : 20);
  envData[i + 3] = 255;
}
const env = new THREE.DataTexture(envData, 64, 32);
env.generateMipmaps = true;
env.minFilter = THREE.LinearMipmapLinearFilter;
env.magFilter = THREE.LinearFilter;
env.wrapS = THREE.RepeatWrapping;
env.needsUpdate = true;
const material = new THREE.ShaderMaterial({
  uniforms: {
    uMode: { value: 0 }, uShift: { value: 0 }, uFrame: { value: 0 },
    uRes: { value: new THREE.Vector2(innerWidth, innerHeight) },
    uEnv: { value: env }, uEnvHeight: { value: 32 },
  },
  vertexShader: 'varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
  fragmentShader,
});
const scene = new THREE.Scene();
const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
quad.frustumCulled = false;
quad.name = 'rt';
scene.add(quad);
const camera = new THREE.Camera();
const probe = new THREE.WebGLRenderTarget(W, H);
const bytes = new Uint8Array(W * H * 4);
// Renders one test mode at W x H; `on` counts white pixels, `plane` white or black (not the grey sky).
function countOn(mode, shift = 0) {
  material.uniforms.uMode.value = mode;
  material.uniforms.uShift.value = shift;
  material.uniforms.uRes.value.set(W, H);
  renderer.setRenderTarget(probe);
  renderer.render(scene, camera);
  renderer.readRenderTargetPixels(probe, 0, 0, W, H, bytes);
  renderer.setRenderTarget(null);
  let on = 0, plane = 0;
  for (let i = 0; i < bytes.length; i += 4) {
    if (bytes[i] > 160) on++;
    if (bytes[i] > 160 || bytes[i] < 96) plane++;
  }
  return { on, plane };
}
function accumulatedNoise(frames) {
  material.uniforms.uMode.value = 5;
  material.uniforms.uRes.value.set(W, H);
  const acc = makeAccumulator(renderer, W, H);
  for (let f = 0; f < frames; f++) { material.uniforms.uFrame.value = f; acc.add(scene, camera); }
  const px = new Float32Array(W * H * 4);
  renderer.readRenderTargetPixels(acc.target, 0, 0, W, H, px);
  let s = 0, s2 = 0, n = 0;
  for (let i = 0; i < px.length; i += 4) { s += px[i]; s2 += px[i] * px[i]; n++; }
  const mean = s / n;
  return { mean: +mean.toFixed(4), spread: +Math.sqrt(s2 / n - mean * mean).toFixed(4) };
}
window.rtMeasure = () => {
  const acne = (mode, shift) => { const r = countOn(mode, shift); return +(1 - r.on / r.plane).toFixed(4); };
  const out = {
    acneFixedAtOrigin: acne(1, 0), acneFixedAt1e4: acne(1, 1e4),
    acneOffsetAtOrigin: acne(2, 0), acneOffsetAt1e4: acne(2, 1e4),
    sphereNaivePx: countOn(3).on, sphereStablePx: countOn(4).on,
    sphereExpectedPx: Math.round(Math.PI * (Math.tan(Math.asin(1e-4)) / 1.25e-4 * 128) ** 2),
    escapeShare: +(countOn(6).on / (W * H)).toFixed(4), escapeExpected: +Math.exp(-1).toFixed(4),
    noise16: accumulatedNoise(16), noise64: accumulatedNoise(64),
  };
  material.uniforms.uMode.value = 0;
  material.uniforms.uRes.value.set(innerWidth, innerHeight);
  return JSON.stringify(out);
};
renderer.setAnimationLoop(() => renderer.render(scene, camera));
</script>
