<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fixture: camera standing on a landscape under a moon and stars</title>
  <script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js" } }
  </script>
</head>
<body style="margin:0">
  <script type="module">
    // Correct scene that used to trip the bounds checks: a far moon and a star field
    // stretched the bounds, and a camera on wide flat ground is inside them.
    import * as THREE from 'three';
    const renderer = new THREE.WebGLRenderer();
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0a1022, 0.03);
    scene.background = new THREE.Color(0x0a1022);
    const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.1, 600);
    camera.position.set(3, 2, 8);
    camera.lookAt(0, 0.5, 0);
    scene.add(new THREE.HemisphereLight(0x8899cc, 0x221a10, 1.5));
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 120), new THREE.MeshStandardMaterial({ color: 0x2a3520 }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);
    const tent = new THREE.Mesh(new THREE.ConeGeometry(1.2, 1.6, 4), new THREE.MeshStandardMaterial({ color: 0xc0703a }));
    tent.position.y = 0.8;
    scene.add(tent);
    const moon = new THREE.Mesh(new THREE.SphereGeometry(7, 24, 12), new THREE.MeshBasicMaterial({ color: 0xfff6dc, fog: false }));
    moon.position.set(-60, 120, -180);
    scene.add(moon);
    const pts = [];
    for (let i = 0; i < 300; i++) { const a = i * 2.39996, y = 0.1 + (i / 300) * 0.9; pts.push(Math.cos(a) * 400 * Math.sqrt(1 - y * y), y * 400, Math.sin(a) * 400 * Math.sqrt(1 - y * y)); }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xdfe6ff, size: 1.5, sizeAttenuation: false, fog: false })));
    renderer.setAnimationLoop(() => renderer.render(scene, camera));
  </script>
</body>
</html>
