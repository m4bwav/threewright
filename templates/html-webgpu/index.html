<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>three.js starter (single file, WebGPU + TSL)</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0d12; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
  <!-- Pin the exact version. "three" and "three/webgpu" map to the same file so
       addons that import "three" share one copy of the library. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <script type="module">
    import * as THREE from 'three/webgpu';
    import { color, mix, oscSine, pass, positionLocal, time, uniform } from 'three/tsl';
    import { bloom } from 'three/addons/tsl/display/BloomNode.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    // WebGPURenderer uses WebGPU when the browser has it and WebGL 2 otherwise.
    const renderer = new THREE.WebGPURenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);
    // Initialise before PMREM, compute or render calls (the *Async methods are deprecated since r181).
    await renderer.init();

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d12);
    const pmrem = new THREE.PMREMGenerator(renderer);
    // RoomEnvironment builds meshes only to bake the environment: dispose them after.
    const room = new RoomEnvironment();
    scene.environment = pmrem.fromScene(room, 0.04).texture;
    room.dispose();

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(3, 2.2, 4);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 0.8, 0);
    controls.enableDamping = true;

    const sun = new THREE.DirectionalLight(0xffffff, 2);
    sun.position.set(4, 6, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    // A TSL material: colour and glow are computed on the GPU from the vertex
    // position and the renderer's time, with no GLSL or WGSL written by hand.
    const glow = uniform(color(0x3fa7ff));
    const bands = oscSine(positionLocal.y.mul(3).add(time.mul(0.5)));
    const material = new THREE.MeshStandardNodeMaterial({ metalness: 0.3, roughness: 0.35 });
    material.colorNode = mix(color(0x16233a), glow, bands);
    material.emissiveNode = glow.mul(bands.pow(6)).mul(1.5);

    const knot = new THREE.Mesh(new THREE.TorusKnotGeometry(0.5, 0.16, 160, 24), material);
    knot.name = 'knot';
    knot.position.y = 0.9;
    knot.castShadow = true;
    scene.add(knot);

    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(3, 64),
      new THREE.MeshStandardNodeMaterial({ color: 0x3a3d45, roughness: 0.9 })
    );
    ground.name = 'ground';
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Post-processing is a node graph: the scene pass plus bloom on its colour.
    const pipeline = new THREE.RenderPipeline(renderer);
    const scenePass = pass(scene, camera);
    const sceneColor = scenePass.getTextureNode('output');
    pipeline.outputNode = sceneColor.add(bloom(sceneColor, 0.8, 0.4, 0.6));

    // Timer replaces the deprecated Clock (r183). Drive motion from elapsed
    // time so any frame rate, and frame-by-frame video capture, look the same.
    const timer = new THREE.Timer();
    timer.connect(document);
    renderer.setAnimationLoop((t) => {
      timer.update(t);
      const e = timer.getElapsed();
      knot.rotation.set(e * 0.4, e * 0.6, 0);
      controls.update();
      pipeline.render();
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
