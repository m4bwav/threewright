<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>three.js game starter (Vite, TypeScript, Rapier)</title>
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8ec5ff; font: 16px/1.4 system-ui, sans-serif; }
    #app canvas { display: block; width: 100%; height: 100%; }
    #hud { position: fixed; inset: 12px 16px auto; display: flex; justify-content: space-between; color: #fff; text-shadow: 0 1px 2px #0008; pointer-events: none; font-weight: 600; }
    #hint { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center; color: #fff; text-shadow: 0 1px 2px #0008; pointer-events: none; }
    #panel { position: fixed; inset: 0; display: grid; place-items: center; background: #0006; }
    #panel[hidden] { display: none; }
    #panel > div { background: #fff; color: #222; padding: 24px 28px; border-radius: 10px; max-width: 22rem; text-align: center; }
    #panel button { font: inherit; padding: 8px 18px; border-radius: 6px; border: 0; background: #2266dd; color: #fff; cursor: pointer; }
    #panel button:focus-visible { outline: 3px solid #ffb000; outline-offset: 2px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud" aria-live="polite"><span id="score"></span><span id="lives" aria-label="lives"></span></div>
  <div id="hint"></div>
  <div id="panel" hidden role="dialog" aria-labelledby="panel-title">
    <div><h2 id="panel-title"></h2><p id="panel-text"></p><button id="panel-button" type="button"></button></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
